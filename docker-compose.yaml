version: '3'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "8080:8080"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: mlflow server \
             --backend-store-uri sqlite:///mlflow.db \
             --default-artifact-root /mlflow/mlruns \
             --host 0.0.0.0 \
             --port 8080