version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "9000:9000"
    depends_on:
      - mlflow
      - prometheus
      - grafana
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - MLFLOW_TRACKING_URI=http://mlflow:8080 

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "8080:8080"
    command: mlflow server --host 0.0.0.0 --port 8080 --backend-store-uri /mlflow/mlruns
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app-network
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - app-network
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  grafana-storage:

networks:
  app-network:
